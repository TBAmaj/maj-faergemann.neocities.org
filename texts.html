  <script>
    // ========================================
    // LOGO TOOLTIP FUNCTIONALITY
    // ========================================
    // This script creates a hover tooltip that follows the mouse cursor
    // when hovering over the spRadio logo link
    
    // GET ELEMENTS: Logo link and tooltip elements
    const logoLink = document.querySelector('.logo-link');
    const tooltip = document.getElementById('logo-tooltip');
    
    // EVENT: Mouse movement over logo - show and position tooltip
    logoLink.addEventListener('mousemove', function (e) {
      tooltip.style.display = 'block'; // Make tooltip visible
      
      // POSITIONING: Follow mouse cursor with small offset
      tooltip.style.left = (e.clientX + 15) + 'px'; // 15px right of cursor
      tooltip.style.top = (e.clientY + 10) + 'px';  // 10px below cursor
    });
    
    // EVENT: Mouse leaves logo - hide tooltip
    logoLink.addEventListener('mouseleave', function () {
      tooltip.style.display = 'none'; // Hide tooltip
    });

    // ========================================
    // NEWSLETTER FORM MODAL POPUP
    // ========================================
    // This script handles the newsletter signup form submission
    // Shows a modal popup instead of actually sending the form
    
    // GET ELEMENTS: Form, modal, and OK button
    const newsletterForm = document.getElementById('newsletter-form');
    const modal = document.getElementById('newsletter-modal');
    const modalOk = document.getElementById('modal-ok');
    
    // EVENT: Form submission - show modal instead of sending
    newsletterForm.addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent actual form submission
      modal.style.display = 'flex'; // Show the modal popup
    });
    
    // EVENT: OK button click - close modal
    modalOk.addEventListener('click', function() {
      modal.style.display = 'none'; // Hide the modal popup
    });
  </script>

  <!-- JAVA script for last modified date-->
  <script>
    // ========================================
    // LAST MODIFIED DATE DISPLAY
    // ========================================
    // This script automatically updates the "Last updated" date in the footer
    // It gets the file's last modification date and formats it nicely
    
    // GET MODIFICATION DATE: Browser provides document.lastModified automatically
    const modifiedDate = new Date(document.lastModified);
    
    // FORMAT OPTIONS: Configure how the date should be displayed
    const options = { 
      year: 'numeric',    // Show full year (2025)
      month: 'long',      // Show full month name (January)  
      day: 'numeric'      // Show day number (15)
    };
    
    // UPDATE FOOTER: Find the span with ID "last-modified" and update its text
    document.getElementById("last-modified").textContent = 
      modifiedDate.toLocaleDateString('en', options); // Format in English
  </script>

  <!-- MOBILE ENHANCEMENT: Better touch interaction -->
  <script>
    // ========================================
    // MOBILE TOUCH ENHANCEMENTS
    // ========================================
    // This script improves the mobile experience for the home page
    
    // MODAL ENHANCEMENT: Close modal when clicking outside content
    if ('ontouchstart' in window) {
      const modal = document.getElementById('newsletter-modal');
      
      modal.addEventListener('click', function(e) {
        // CLICK OUTSIDE: Close modal if clicking on background
        if (e.target === modal) {
          modal.style.display = 'none';
        }
      });
      
      // PREVENT BOUNCE: Disable scroll bounce on iOS
      document.body.addEventListener('touchmove', function(e) {
        if (e.target === document.body) {
          e.preventDefault();
        }
      }, { passive: false });
    }
  </script>
